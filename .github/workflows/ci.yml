name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JVM, Android, Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build and run tests
        run: ./gradlew build --no-daemon --stacktrace

  ios:
    name: iOS targets (compile, simulator tests)
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Compile iOS targets
        run: >-
          ./gradlew --no-daemon --stacktrace
          :ktus:compileKotlinIosArm64 :ktus:compileKotlinIosSimulatorArm64 :ktus:compileKotlinIosX64
          :ktus-okio:compileKotlinIosArm64 :ktus-okio:compileKotlinIosSimulatorArm64 :ktus-okio:compileKotlinIosX64

      # Includes the Darwin-engine real-socket tests (a local POSIX socket server on the simulator).
      - name: Run iOS simulator tests
        run: ./gradlew --no-daemon --stacktrace :ktus:iosSimulatorArm64Test :ktus-okio:iosSimulatorArm64Test
